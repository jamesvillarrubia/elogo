designBrief: |
  We need a logo for a new social media platform that focuses on professional networking and career development.
  The logo should convey:
  - Professionalism and trust
  - Connection and community
  - Growth and opportunity
  - Modern and innovative approach
  - Clean and memorable design

  The target audience is professionals aged 25-45 who are looking to advance their careers and build meaningful professional relationships.
  The platform will be used for:
  - Professional networking
  - Job searching
  - Industry knowledge sharing
  - Career development
  - Professional branding

