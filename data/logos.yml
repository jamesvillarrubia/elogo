designBrief: |
  # Professional Networking Platform Logo Design Brief

  We need a logo for a new social media platform that focuses on professional networking and career development.

  ## Key Attributes
  The logo should convey:
  - **Professionalism and trust** - Establish credibility in the professional space
  - **Connection and community** - Represent networking and relationship building
  - **Growth and opportunity** - Symbolize career advancement and development
  - **Modern and innovative approach** - Reflect cutting-edge technology and fresh ideas
  - **Clean and memorable design** - Ensure instant recognition and recall

  ## Target Audience
  Professionals aged 25-45 who are looking to:
  - Advance their careers
  - Build meaningful professional relationships
  - Share industry knowledge
  - Develop their professional brand

  ## Platform Features
  The platform will be used for:
  - Professional networking
  - Job searching
  - Industry knowledge sharing
  - Career development
  - Professional branding

